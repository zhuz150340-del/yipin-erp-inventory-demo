const mapOldCategory=i=>{if(['金属材料','表面材料','配件材料','包装材料','辅助材料','半成品','成品'].includes(i.cat))return;
const old=i.cat,sub=i.sub||'';
if(old==='原材料库')i.cat='金属材料';
else if(old==='配件库'){
 if(['塑粉','油漆','装甲门油漆','胶水','磷化药水','色卡','保护膜'].includes(sub))i.cat='表面材料';
 else if(['包装类','纸箱','泡沫板','珍珠棉包装','蜂窝纸包装','包装袋'].includes(sub))i.cat='包装材料';

else if(old==='成品库')i.cat='成品';
else i.cat='辅助材料';

const warehouseForItem=i=>warehouseForCategory(i.cat);

(i.buckets||[]).forEach(b=>{b.warehouse=b.warehouse||i.warehouse;b.location=b.location||i.location;b.frozen=Number(b.frozen||0);b.pending=Number(b.pending||0);b.reserved=Number(b.reserved||0);b.transit=Number(b.transit||0);});
return i;};
const seeded=()=>{const items=clone(INITIAL_ITEMS).map(migrateItem);return {items,txns:openingTransactions(items),anomalies:[],counts:[],logs:[],changeOrders:[],documents:[],counter:10000}};

function notify(msg){document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.__tt);window.__tt=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500)}
function crumb(){let sub=MODULES.find(x=>x.k===ui.module)?.children.find(x=>x[0]===ui.view)?.[1]||'';if((ui.view==='material-stock'||ui.view==='warehouse-stock')&&ui.cat!=='全部')sub+=' / '+ui.cat+(ui.sub!=='全部'?' / '+ui.sub:'');return `亿品 ERP / ${ui.module==='material'?'物料管理':'仓库管理'} / <b>${esc(sub)}</b>`}
function warehouseNav(){return MODULES.find(x=>x.k==='warehouse').children.map(c=>`<button class="nav-sub ${ui.view===c[0]?'active':''}" data-action="nav" data-module="warehouse" data-view="${c[0]}">${c[1]}</button>`).join('')}
function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="logo">亿</div><div>亿品 ERP<small>V1.1 物料与库存管理 · 本地演示</small></div></div>${MODULES.map(m=>`<div class="nav-group"><button class="nav-head ${ui.module===m.k?'active':''}" data-action="toggle-nav" data-module="${m.k}"><span class="fl"><span style="font-size:20px">${m.icon}</span><span>${m.t}</span></span><span class="chevron ${ui.navOpen===m.k?'open':''}">${ui.navOpen===m.k?'⌄':'›'}</span></button>${ui.navOpen===m.k?(m.k==='warehouse'?warehouseNav():m.children.map(c=>`<button class="nav-sub ${ui.view===c[0]?'active':''}" data-action="nav" data-module="${m.k}" data-view="${c[0]}">${c[1]}</button>`).join('')):''}</div>`).join('')}<div class="side-foot">● 所有操作仅在本地浏览器中模拟<br/>来源：上传物料案例 + 明示补充数据</div></aside>`}
function header(){return `<header class="topbar"><div class="breadcrumbs">${crumb()}</div><div class="top-right"><span class="mode-dot"></span> 可交互演示 <button class="btn sm ${ui.designMode?'soft':''}" data-action="toggle-design">✎ ${ui.designMode?'退出结构编辑':'页面结构编辑'}</button><button class="btn sm" data-action="reset">↺ 重置演示</button></div></header>`}

const title=(t,subtitle,buttons='')=>`<div class="pagehead"><div><h1>${t}</h1><div class="subline">${subtitle}</div></div><div class="actions">${buttons}</div></div>`;
const materialBtns=()=>`<button class="btn" data-action="import">⇧ 批量导入</button><button class="btn" data-action="export-material">↗ 导出</button><button class="btn primary" data-action="add-material">＋ 新增</button>`;
const MATERIAL_CATS=['金属材料','表面材料','配件材料','包装材料','辅助材料'];
const WAREHOUSE_CATS=['半成品','成品'];
const ALL_CATS=[...MATERIAL_CATS,...WAREHOUSE_CATS];
const WAREHOUSES=['金属材料仓','表面材料仓','配件材料仓','包装材料仓','辅助材料仓','半成品仓','成品仓','综合仓'];
const catTree=(allowW=false,scope='material')=>{let cats=allowW?(scope==='warehouse'?WAREHOUSE_CATS:MATERIAL_CATS):ALL_CATS;let heading=allowW?(scope==='warehouse'?'仓库库存':'物料库存'):'物料分类';let allLabel=allowW?(scope==='warehouse'?'全部仓库库存':'全部物料库存'):'全部物料档案';let rows=cats.map(c=>{let expanded=!!ui.expandedCats[c],count=db.items.filter(i=>i.cat===c).length;return `<div class="cat-row ${ui.cat===c?'selected':''} ${allowW&&scope==='warehouse'?'warm':''}"><div class="cat-main" data-action="cat" data-cat="${esc(c)}" data-sub="全部"><span class="tree-caret">${expanded?'⌄':'›'}</span><span class="folder-icon">📁</span><span class="cat-name">${esc(c)}</span><span class="cat-count">${count}</span></div><button class="tree-toggle" title="${expanded?'收起':'展开'}" data-action="toggle-cat" data-cat="${esc(c)}">${expanded?'⌄':'›'}</button></div>${expanded?(TREES[c]||[]).map(sub=>`<button class="catbtn child ${ui.cat===c&&ui.sub===sub?'active':''}" data-action="cat-sub" data-cat="${esc(c)}" data-sub="${esc(sub)}">· ${esc(sub)}</button>`).join(''):''}`}).join('');return `<div class="panel tree ${allowW?'stock-tree':''} ${allowW&&scope==='warehouse'?'warm-tree':''}"><div class="sectiontitle">${heading}<span class="muted">▤</span></div><button class="catbtn ${ui.cat==='全部'?'active':''}" data-action="cat" data-cat="全部" data-sub="全部">▦ ${allLabel}</button>${rows}</div>`};
const rowSource=i=>i.source==='演示补充'?`<span class="legend">模拟补充</span>`:'';
function materialList(){let list=filterItems();if(ui.audit!=='全部')list=list.filter(i=>(i.auditStatus||'已审核')===ui.audit);if(ui.propertyFilter!=='全部')list=list.filter(i=>i.property===ui.propertyFilter);if(ui.createdFrom)list=list.filter(i=>String(i.createdAt||'').slice(0,10)>=ui.createdFrom);if(ui.createdTo)list=list.filter(i=>String(i.createdAt||'').slice(0,10)<=ui.createdTo);let selectedCount=(ui.selectedMaterials||[]).length;let buttons=`<button class="btn" data-action="bulk-material" data-op="edit">修改</button><button class="btn" data-action="bulk-material" data-op="submit">提交审核</button><button class="btn" data-action="bulk-material" data-op="approve">审核</button><button class="btn" data-action="bulk-material" data-op="unapprove">反审核</button><button class="btn" data-action="bulk-material" data-op="freeze">冻结</button><button class="btn" data-action="bulk-material" data-op="disable">停用</button><button class="btn danger" data-action="bulk-material" data-op="archive">删除</button><button class="btn" data-action="import">⇧ 导入</button><button class="btn" data-action="export-material">↗ 导出</button><button class="btn" data-action="refresh">⟳ 刷新</button><button class="btn primary" data-action="add-material">＋ 新增</button>`;let filter=`<details class="filter-fold" open><summary>筛选条件 <span class="muted">支持组合筛选</span></summary><div class="filters"><input class="input search" value="${esc(ui.q)}" placeholder="物料编码 / 名称 / 规格" data-filter="q"/><select class="select" data-filter="cat">${categoryOptions(ui.cat,true,ALL_CATS)}</select><select class="select" data-filter="status">${option(['全部','正常','冻结','停用','已归档'],ui.status)}</select><select class="select" data-filter="audit">${option(['全部','未提交','待审核','已审核','已驳回'],ui.audit)}</select><select class="select" data-filter="propertyFilter">${option(['全部','外购','自制','委外'],ui.propertyFilter)}</select><input class="input" type="date" data-filter="createdFrom" value="${esc(ui.createdFrom)}" title="创建开始日期"/><input class="input" type="date" data-filter="createdTo" value="${esc(ui.createdTo)}" title="创建结束日期"/><button class="btn" data-action="reset-filters">重置</button><span class="muted tiny">当前选中 ${selectedCount} 条 · 共 ${list.length} 条</span></div></details>`;
let rows=list.map((i,idx)=>`<tr><td><input type="checkbox" data-select-material="${i.id}" ${ui.selectedMaterials?.includes(i.id)?'checked':''}></td><td>${idx+1}</td><td><a data-action="detail" data-id="${i.id}">${esc(i.code||'未赋识别码')}</a><div class="thint" title="系统物料代码">${esc(i.id)}</div></td><td class="name"><b>${esc(i.name)}</b><div class="thint">${esc(i.erpName||'')}</div></td><td>${esc(i.cat)}<div class="thint">${esc(i.sub)}</div></td><td>${esc(i.model||'—')}</td><td>${esc(i.unit)}</td><td>${badge(i.property||'外购')}</td><td>${badge(i.status)}</td><td>${badge(i.auditStatus||'已审核')}</td><td>V${i.version||1}</td><td>${esc(updated(i)||'—')}</td><td><div class="row-actions">${linkbtn('详情','detail',i.id)}${linkbtn('修改','edit-material',i.id)}${linkbtn('变更','new-change',i.id)}${linkbtn('删除','archive-material',i.id)}</div></td></tr>`).join('');
return `${title('基础物料档案','统一维护物料身份、技术资料和业务属性；系统物料代码由系统生成，物料编码为内部识别码。',buttons)}<div class="split">${catTree(false)}<div class="panel tablebox">${filter}<div class="scroll-table"><table class="data-table"><thead><tr><th><input type="checkbox" data-select-all-material ${list.length&&list.every(i=>ui.selectedMaterials?.includes(i.id))?'checked':''}></th>${['序号','物料编码 / 系统代码','物料名称','物料分类','规格型号','基本单位','物料属性','使用状态','审核状态','最新版本','更新时间','操作'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="13" class="empty">当前条件下没有物料档案。</td></tr>'}</tbody></table></div><div class="footerline"><span>共 ${list.length} 条 · 系统物料代码为内部唯一关联键</span><span>双击物料编码或点击详情查看档案卡片</span></div></div></div>`}

function materialStats(){let total=db.items.length,used=db.items.filter(x=>x.status==='正常').length,groups=ALL_CATS.map(c=>({c,n:db.items.filter(x=>x.cat===c).length})),max=Math.max(...groups.map(x=>x.n),1),replace=db.changeOrders.filter(x=>x.type==='物料替代').length;return `${title('物料统计','统计物料主数据数量、分类结构、物料属性及使用状态。',`<button class="btn" data-action="export-material">↗ 导出明细</button>`)}<div class="stats"><div class="statcard"><div class="stitle">物料档案总数</div><div class="val">${total}</div><div class="hint">包含半成品与成品档案</div></div><div class="statcard"><div class="stitle">正常使用</div><div class="val">${used}</div><div class="hint">冻结、停用 ${total-used} 项</div></div><div class="statcard"><div class="stitle">外购物料</div><div class="val">${db.items.filter(i=>i.property==='外购').length}</div><div class="hint">按物料属性统计</div></div><div class="statcard"><div class="stitle">物料变更单</div><div class="val">${db.changeOrders.length}</div><div class="hint">其中替代类 ${replace} 项</div></div></div><div class="grid2"><div class="panel p16"><h3>物料分类分布</h3>${groups.map(x=>`<div style="padding:10px 0"><div class="kv" style="justify-content:space-between;margin-bottom:8px"><b>${x.c}</b><span>${x.n} 条</span></div><div class="bar"><span style="width:${x.n/max*100}%"></span></div></div>`).join('')}</div><div class="panel p16"><h3>物料属性及使用状态</h3>${['外购','自制','委外'].map(p=>`<div class="alertrow"><b>${p}</b><span>${db.items.filter(i=>i.property===p).length} 项</span></div>`).join('')}${['正常','冻结','停用'].map(p=>`<div class="alertrow"><b>${p}</b><span>${db.items.filter(i=>i.status===p).length} 项</span></div>`).join('')}<div class="notice">统计基于物料档案，不将不同计量单位的库存数量直接相加。</div></div></div>`}

function bulkMaterialAction(op){let ids=[...(ui.selectedMaterials||[])];if(!ids.length){notify('请先勾选物料档案。');return}if(op==='edit'){if(ids.length!==1){notify('批量修改请只选择一条物料档案。');return}showModal('edit',{id:ids[0]});return}let done=0,skipped=0;for(let id of ids){let i=db.items.find(x=>x.id===id);if(!i)continue;if(op==='submit'){i.auditStatus='待审核';done++}else if(op==='approve'){if(i.auditStatus==='待审核'){i.auditStatus='已审核';done++}else skipped++}else if(op==='unapprove'){i.auditStatus='未提交';done++}else if(op==='freeze'){i.status=i.status==='冻结'?'正常':'冻结';done++}else if(op==='disable'){i.status=i.status==='停用'?'正常':'停用';done++}else if(op==='archive'){if(hand(i)||resv(i)||pending(i)||transit(i)){skipped++;continue}i.status='已归档';done++}i.updated=now()}db.logs.unshift({type:'批量物料操作',at:now(),detail:`操作 ${op}，成功 ${done} 条，跳过 ${skipped} 条`});ui.selectedMaterials=[];save();render();notify(`批量操作完成：成功 ${done} 条，跳过 ${skipped} 条。`)}
function materialChangePage(){let rows=db.changeOrders.map(o=>{let i=db.items.find(x=>x.id===o.itemId);return [esc(o.id),esc(o.type),esc(i?.code||o.itemId),esc(i?.name||'—'),esc(o.reason),badge(o.status),esc(o.createdAt),o.status==='待审核'?`<button class="btn sm primary" data-action="approve-change" data-id="${o.id}">审核生效</button> <button class="btn sm danger" data-action="reject-change" data-id="${o.id}">驳回</button>`:`<button class="btn sm" data-action="view-change" data-id="${o.id}">查看</button>`]});return `${title('物料变更管理','通过变更单维护基础资料变更、规格图纸变更、物料替代及停用恢复；审核生效后生成新版本。',`<button class="btn primary" data-action="new-change">＋ 新增变更单</button>`)}<div class="stats"><div class="statcard"><div class="stitle">变更单总数</div><div class="val">${db.changeOrders.length}</div></div><div class="statcard"><div class="stitle">待审核</div><div class="val">${db.changeOrders.filter(x=>x.status==='待审核').length}</div></div><div class="statcard"><div class="stitle">已生效</div><div class="val">${db.changeOrders.filter(x=>x.status==='已生效').length}</div></div><div class="statcard"><div class="stitle">已驳回</div><div class="val">${db.changeOrders.filter(x=>x.status==='已驳回').length}</div></div></div><div class="panel tablebox">${table(['变更单号','变更类型','原物料编码','当前物料名称','变更原因','状态','申请时间','操作'],rows)}</div><div class="notice" style="margin-top:12px">替代采用“原物料编码不变、系统物料代码不变、版本递增”的方式。历史采购、库存和业务记录保留原版本信息。</div>`}
function changeForm(itemId=''){let item=db.items.find(x=>x.id===itemId)||db.items[0];if(!item)return'';let body=`<div class="modal-body"><div class="notice">变更单先提交审核，审核生效后才更新当前档案。物料编码与系统物料代码保持不变，历史版本不覆盖。</div><form id="change-form" class="formgrid"><div class="formfield span2"><label>选择物料 *</label><select class="select" name="itemId">${db.items.map(i=>`<option value="${i.id}" ${i.id===item.id?'selected':''}>${esc(i.code||'无识别码')} · ${esc(i.name)}</option>`).join('')}</select></div>${selectField('type','变更类型',['基础信息变更','规格型号变更','技术图纸变更','业务属性变更','物料替代','物料停用及恢复'],'规格型号变更','',true)}${field('effectiveDate','生效日期',now().slice(0,10),'date','',true)}${field('newName','变更后入库名称',item.name,'text','span2',true)}${field('newErpName','变更后 ERP 物料名称',item.erpName||'','text','span2')}${field('newModel','变更后规格型号',item.model||'')}${field('newMaterial','变更后材质',item.material||'')}${field('newSize','变更后尺寸',item.size||'')}${field('newSupplier','变更后供应商',item.supplier||'')}${field('newDrawing','变更后图纸编号',item.drawing||'')}${field('newCost','变更后成本价',item.cost||0,'number','','','min="0" step="0.01"')}${selectField('newStatus','变更后使用状态',['正常','冻结','停用'],item.status)}${field('ratio','替代比例（旧：新）','1:1')}${field('scope','适用产品 / 范围','全部适用','text','span2')}${field('reason','变更原因','','text','span2',true)}<div class="formfield span2"><label>影响说明（BOM、未完成单据、库存）</label><textarea class="textarea" name="impact" rows="3" placeholder="说明是否影响现有 BOM、未完成业务单据及库存处理"></textarea></div></form><div id="form-error" class="err"></div></div>`;return makeModal('新增物料变更单',body,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-change">提交审核</button>`,true)}
function viewChange(id){let o=db.changeOrders.find(x=>x.id===id);if(!o)return'';let i=db.items.find(x=>x.id===o.itemId);let rows=Object.keys(o.newData||{}).map(k=>`<tr><td>${esc(k)}</td><td>${esc(o.oldData?.[k]??'—')}</td><td>${esc(o.newData[k]??'—')}</td></tr>`).join('');return makeModal('物料变更单 · '+esc(o.id),`<div class="modal-body"><div class="kv"><b>${esc(i?.code||'')}</b>${badge(o.status)}<span>${esc(o.type)}</span></div><p>${esc(o.reason)}</p><div class="scroll-table"><table class="data-table"><thead><tr><th>字段</th><th>变更前</th><th>变更后</th></tr></thead><tbody>${rows}</tbody></table></div><p class="help">适用范围：${esc(o.scope||'—')}<br>影响说明：${esc(o.impact||'—')}<br>生效日期：${esc(o.effectiveDate||'—')}</p></div>`,`<button class="btn" data-action="close-modal">关闭</button>`,true)}
function saveChange(){let f=formobj('#change-form');if(!f)return;if(!f.reason?.trim()||!f.newName?.trim()){setErr('变更原因和变更后物料名称必填。');return}let i=db.items.find(x=>x.id===f.itemId);if(!i){setErr('物料不存在');return}let fields=['name','erpName','model','material','size','supplier','drawing','cost','status'];let keys=['newName','newErpName','newModel','newMaterial','newSize','newSupplier','newDrawing','newCost','newStatus'];let oldData={},newData={};fields.forEach((k,n)=>{oldData[k]=i[k]??'';newData[k]=k==='cost'?Number(f[keys[n]]||0):(f[keys[n]]??'')});let o={id:'MC'+key(),itemId:i.id,type:f.type,reason:f.reason,scope:f.scope,impact:f.impact,effectiveDate:f.effectiveDate,oldData,newData,ratio:f.ratio,createdAt:now(),status:'待审核',applicant:'演示用户',history:[]};db.changeOrders.unshift(o);db.logs.unshift({type:'提交物料变更单',at:now(),itemId:i.id,detail:o.id+' '+o.type});save();closeModal();render();notify('变更单已提交，等待审核。')}
function approveChange(id,approved=true){let o=db.changeOrders.find(x=>x.id===id);if(!o||o.status!=='待审核')return;let i=db.items.find(x=>x.id===o.itemId);if(!i)return;if(!approved){o.status='已驳回';o.history.push({at:now(),action:'驳回',operator:'演示审核人'});save();render();notify('变更单已驳回。');return}let old=clone(i),statusOnly=o.type==='物料停用及恢复',next=statusOnly?Number(i.version||1):Number(i.version||1)+1;Object.assign(i,o.newData,{version:next,updated:now()});i.hist=i.hist||[];if(!statusOnly){i.hist.push({fromVersion:old.version,toVersion:next,at:now(),reason:o.reason,old:o.oldData||{},new:o.newData});i.buckets.push({ver:next,onHand:0,reserved:0,pending:0,transit:0,frozen:0,cost:i.cost,warehouse:i.warehouse,location:i.location});}else{i.hist.push({fromVersion:old.version,toVersion:old.version,at:now(),reason:o.reason+'（状态变更）',old:{status:old.status},new:{status:i.status}});}o.status='已生效';o.approvedAt=now();o.approver='演示审核人';o.history.push({at:now(),action:'审核生效',operator:o.approver});db.logs.unshift({type:'物料变更生效',at:now(),itemId:i.id,detail:`${o.id} V${old.version} → V${next}；物料编码保持 ${i.code}`});save();render();notify('变更已生效，已生成新版本，旧版本库存保留。')}

function supplierFlow(){let src=db.txns.filter(t=>['入库','待审核登记','待审确认入库','在途登记','在途到货'].includes(t.type));return `${title('供应商物料流水','展示演示中与收货、在途、待审核有关的库存记录；不创建独立供应商系统。',`<button class="btn primary" data-action="nav" data-module="warehouse" data-view="inbound">＋ 新建入库单</button>`)}<div class="panel tablebox"><div class="notice">该页沿用物料档案中的“供应商名称”和仓库流水。初始案例未提供真实供应商送货流水，新增操作后自动出现记录。</div>${table(['时间','流水编号','类型','物料编码','物料名称','供应商','数量','来源单号','备注'],src.map(t=>{let i=db.items.find(x=>x.id===t.itemId);return [t.at,t.id,t.type,t.code,i?.name||'—',i?.supplier||'—',`${t.qty} ${i?.unit||''}`,t.ref||'—',t.note||'—']}))}</div>`}

function anomalyCandidates(kind){let arr=[];if(kind==='warehouse'){for(let i of db.items){if(danger(i)&&i.status==='正常')arr.push({id:'low:'+i.id,item:i,title:'可用库存低于安全下限',type:'库存不足',level:'中',detail:`可用 ${available(i)} ${i.unit}，最小库存 ${i.min} ${i.unit}`});if(i.status==='停用'&&hand(i)>0)arr.push({id:'stopped:'+i.id,item:i,title:'停用物料仍有实际库存',type:'停用留存',level:'高',detail:`当前在库 ${hand(i)} ${i.unit}，需决定后续领用或处理方式`});if(resv(i)>hand(i))arr.push({id:'over:'+i.id,item:i,title:'占用量超出实物库存',type:'数量冲突',level:'高',detail:`占用 ${resv(i)}，实际 ${hand(i)}`})}}
else{for(let i of db.items){if(!['半成品','成品'].includes(i.cat)&&!i.code)arr.push({id:'missing-code:'+i.id,item:i,title:'物料尚未赋内部识别码',type:'编码待确认',level:'低',detail:'单次物料允许暂缺，但常用物料需确认编码'});if(i.code==='MFT001'&&i.name.includes('E2014')&&i.erpName.includes('E2140'))arr.push({id:'naming:'+i.id,item:i,title:'入库名称与 ERP 名称型号可能不一致',type:'名称规格不一致',level:'中',detail:'入库名称 E2014，ERP名称 E2140；请核对原始资料'});if(!i.unit)arr.push({id:'unit:'+i.id,item:i,title:'物料缺少计量单位',type:'资料缺失',level:'高',detail:'统一规格和库存计量前需补齐'})}}
return arr;}

function documentList(kind){let docs=db.documents.filter(d=>d.kind===kind);let inbound=kind==='inbound',transfer=kind==='transfer';let name=inbound?'入库管理':transfer?'库存调拨':'出库管理';let btn=`<button class="btn primary" data-action="${transfer?'new-transfer':'new-business'}" data-kind="${kind}">＋ 新建${transfer?'调拨单':inbound?'入库单':'出库单'}</button>`;let rows=docs.map(d=>{let i=db.items.find(x=>x.id===d.itemId);let ops=d.status==='待审核'?`<button class="btn sm primary" data-action="${transfer?'post-transfer':'post-business'}" data-id="${d.id}">审核过账</button>`:inbound&&d.status==='待质检'?`<button class="btn sm primary" data-action="quality-pass" data-id="${d.id}">质检合格</button> <button class="btn sm danger" data-action="quality-fail" data-id="${d.id}">不合格冻结</button>`:`<button class="btn sm" data-action="view-document" data-id="${d.id}">查看</button>`;return [esc(d.id),esc(d.docType),esc(i?.code||'—'),esc(i?.name||'—'),`${fmt(d.qty)} ${esc(i?.unit||'')}`,esc(d.warehouse||d.fromWarehouse||'—'),transfer?esc(d.toWarehouse||'—'):esc(d.source||'—'),badge(d.status),esc(d.createdAt),ops]});return `${title(name,inbound?'采购、生产、退料、客户退货及其他入库统一通过入库单确认。':transfer?'调拨只改变库存位置，不改变企业库存总量。':'生产领料、销售发货、采购退货及其他出库统一通过出库单确认。',btn)}<div class="stats"><div class="statcard"><div class="stitle">单据总数</div><div class="val">${docs.length}</div></div><div class="statcard"><div class="stitle">待审核</div><div class="val">${docs.filter(d=>d.status==='待审核').length}</div></div><div class="statcard"><div class="stitle">${inbound?'待质检':'已过账'}</div><div class="val">${docs.filter(d=>d.status===(inbound?'待质检':'已过账')).length}</div></div><div class="statcard"><div class="stitle">已完成</div><div class="val">${docs.filter(d=>d.status==='已完成').length}</div></div></div><div class="panel tablebox"><div class="notice">单据创建后进入待审核；只有审核过账才更新账面库存并生成流水。入库如需质检，先进入待检库存，质检合格后转为可用库存。</div>${table(['单据编号','业务类型','物料编码','物料名称','数量','来源仓库','对方 / 目标仓库','单据状态','创建时间','操作'],rows)}</div>`}
function businessForm(kind){let inbound=kind==='inbound';let types=inbound?['采购入库','生产入库','生产退料入库','客户退货入库','其他入库']:['生产领料出库','销售发货出库','采购退货出库','其他出库'];let i=db.items[0];let body=`<div class="modal-body"><div class="notice">${inbound?'入库单审核过账后增加账面库存；需要质检的物料先计入待检库存。':'出库单审核过账后扣减账面库存，不能超过对应仓库库位可用库存。'}</div><form id="business-form" class="formgrid" data-kind="${kind}"><div class="formfield span2"><label>物料 *</label><select class="select" name="itemId">${db.items.map(x=>`<option value="${x.id}">${esc(x.code||x.id)} · ${esc(x.name)}</option>`).join('')}</select></div>${selectField('docType','业务类型',types,types[0],'',true)}${field('qty','实际数量',1,'number','',true,'min="1" step="1"')}${selectField('warehouse','入库 / 出库仓库',WAREHOUSES,i?.warehouse||WAREHOUSES[0],'',true)}${field('location','库位',i?.location||'A-01','text','',true)}${field('source','来源单号','SOURCE-001','text','',true)}${field('partner',inbound?'供应商 / 来源部门':'领用部门 / 客户','待填写')}${field('date','业务日期',now().slice(0,10),'date','',true)}${inbound?selectField('quality','是否需要质检',['否','是'],'否'):''}<div class="formfield span2"><label>备注</label><textarea class="textarea" name="note" rows="3"></textarea></div></form><div id="form-error" class="err"></div></div>`;return makeModal(inbound?'新增入库单':'新增出库单',body,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-business">保存并提交审核</button>`,true)}
function transferForm(){let i=db.items[0];let wh=i?.warehouse||WAREHOUSES[0];let body=`<div class="modal-body"><div class="notice">审核调拨单时同时生成调出、调入两条库存流水，企业总库存数量不变。</div><form id="transfer-form" class="formgrid"><div class="formfield span2"><label>选择物料 *</label><select class="select" name="itemId">${db.items.map(x=>`<option value="${x.id}">${esc(x.code||x.id)} · ${esc(x.name)}</option>`).join('')}</select></div>${field('qty','调拨数量',1,'number','',true,'min="1" step="1"')}${field('source','来源单号','TRANSFER-001','text','',true)}${selectField('fromWarehouse','调出仓库',WAREHOUSES,wh,'',true)}${selectField('toWarehouse','调入仓库',WAREHOUSES,WAREHOUSES.find(x=>x!==wh)||'综合仓','',true)}${field('fromLocation','调出库位','A-01','text','',true)}${field('toLocation','调入库位','B-01','text','',true)}${field('date','调拨日期',now().slice(0,10),'date','',true)}<div class="formfield span2"><label>备注</label><textarea class="textarea" name="note" rows="3"></textarea></div></form><div id="form-error" class="err"></div></div>`;return makeModal('新增库存调拨单',body,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-transfer">保存并提交审核</button>`,true)}
function saveBusiness(){let f=formobj('#business-form');if(!f)return;let qty=Number(f.qty),i=db.items.find(x=>x.id===f.itemId);if(!i||!Number.isInteger(qty)||qty<=0||!f.source?.trim()){setErr('请填写有效物料、正整数数量和来源单号。');return}let kind=ui.modal?.kind||document.querySelector('#business-form')?.dataset.kind||'inbound';let d={id:(kind==='inbound'?'RK':'CK')+key(),kind,docType:f.docType,itemId:i.id,version:i.version,qty,warehouse:f.warehouse,location:f.location,source:f.source,partner:f.partner,date:f.date,quality:f.quality==='是',note:f.note,createdAt:now(),status:'待审核',operator:'演示用户'};db.documents.unshift(d);save();closeModal();render();notify('单据已保存，等待审核过账。')}
function postBusiness(id){let d=db.documents.find(x=>x.id===id);if(!d||d.status!=='待审核')return;let i=db.items.find(x=>x.id===d.itemId);try{if(d.kind==='inbound'){if(d.quality){stockTxn(i,d.version,'待检入库',d.qty,d.id,d.note,d.warehouse,d.location);d.status='待质检'}else{stockTxn(i,d.version,'入库',d.qty,d.id,d.note,d.warehouse,d.location);d.status='已完成'}}else{stockTxn(i,d.version,'出库',d.qty,d.id,d.note,d.warehouse,d.location);d.status='已过账'}d.postedAt=now();d.approver='演示审核人';save();render();notify('单据审核过账成功，库存流水已生成。')}catch(e){notify(e.message)}}
function qualityResult(id,pass){let d=db.documents.find(x=>x.id===id);if(!d||d.status!=='待质检')return;let i=db.items.find(x=>x.id===d.itemId);try{stockTxn(i,d.version,pass?'质检合格入库':'质检不合格冻结',d.qty,d.id,pass?'质检合格转可用库存':'质检不合格转冻结库存',d.warehouse,d.location);d.status='已完成';d.qualityResult=pass?'合格':'不合格';d.completedAt=now();save();render();notify(pass?'质检合格，已转入账面可用库存。':'已转入冻结库存，需后续处理。')}catch(e){notify(e.message)}}
function saveTransfer(){let f=formobj('#transfer-form');if(!f)return;let qty=Number(f.qty),i=db.items.find(x=>x.id===f.itemId);if(!i||!Number.isInteger(qty)||qty<=0||f.fromWarehouse===f.toWarehouse){setErr('请确认物料、数量及不同的调出/调入仓库。');return}let d={id:'DB'+key(),kind:'transfer',docType:'仓库调拨',itemId:i.id,version:i.version,qty,fromWarehouse:f.fromWarehouse,toWarehouse:f.toWarehouse,fromLocation:f.fromLocation,toLocation:f.toLocation,source:f.source,note:f.note,date:f.date,createdAt:now(),status:'待审核'};db.documents.unshift(d);save();closeModal();render();notify('调拨单已创建，待审核。')}
function postTransfer(id){let d=db.documents.find(x=>x.id===id);if(!d||d.status!=='待审核')return;let i=db.items.find(x=>x.id===d.itemId),from=bucket(i,d.version,d.fromWarehouse);if(!from||d.qty>from.onHand-from.reserved-(from.frozen||0)){notify('调出仓库可用库存不足，不能过账。');return}let to=ensureBucket(i,d.version,d.toWarehouse,d.toLocation),beforeFrom=from.onHand,beforeTo=to.onHand;from.onHand-=d.qty;to.onHand+=d.qty;let at=now();db.txns.unshift({id:'STK'+key(),at,itemId:i.id,code:i.code,version:d.version,type:'调拨调出',qty:d.qty,before:beforeFrom,after:from.onHand,inQty:0,outQty:d.qty,direction:'调拨',warehouse:d.fromWarehouse,location:d.fromLocation,ref:d.id,note:d.note,operator:'演示审核人'});db.txns.unshift({id:'STK'+key(),at,itemId:i.id,code:i.code,version:d.version,type:'调拨调入',qty:d.qty,before:beforeTo,after:to.onHand,inQty:d.qty,outQty:0,direction:'调拨',warehouse:d.toWarehouse,location:d.toLocation,ref:d.id,note:d.note,operator:'演示审核人'});i.updated=at;d.status='已完成';d.postedAt=at;save();render();notify('调拨已过账：企业总库存不变，库存位置已更新。')}
function viewDocument(id){let d=db.documents.find(x=>x.id===id);if(!d)return;let i=db.items.find(x=>x.id===d.itemId);showModal('document-detail',{id})}
function documentDetail(id){let d=db.documents.find(x=>x.id===id);if(!d)return'';let i=db.items.find(x=>x.id===d.itemId);return makeModal('库存业务单据 · '+esc(d.id),`<div class="modal-body"><dl class="details">${[['单据类型',d.docType],['物料编码',i?.code],['物料名称',i?.name],['规格型号',i?.model],['数量',d.qty],['仓库',d.warehouse||d.fromWarehouse],['目标仓库',d.toWarehouse],['来源单号',d.source],['状态',d.status],['创建时间',d.createdAt],['过账时间',d.postedAt||'—'],['操作人',d.operator||'—'],['备注',d.note||'—']].map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b??'—')}</dd>`).join('')}</dl></div>`,`<button class="btn" data-action="close-modal">关闭</button>`,true)}

function monthly(){let tasks=db.counts;return `${title('库存盘点','创建盘点任务、录入实盘数量、处理盘盈盘亏；审核完成后生成库存流水。',`<button class="btn primary" data-action="new-count">＋ 新建盘点任务</button>`)}<div class="stats"><div class="statcard"><div class="stitle">盘点任务</div><div class="val">${tasks.length}</div></div><div class="statcard"><div class="stitle">待盘点</div><div class="val">${tasks.filter(t=>t.status!=='已完成').length}</div></div><div class="statcard"><div class="stitle">已完成</div><div class="val">${tasks.filter(t=>t.status==='已完成').length}</div></div><div class="statcard"><div class="stitle">差异流水</div><div class="val">${db.txns.filter(t=>['盘盈调整','盘亏调整'].includes(t.type)).length}</div></div></div><div class="panel tablebox"><div class="notice">盘点以仓库和库位为维度冻结账面快照。盘点审核后才更新库存，原账面数、实盘数和差异原因均保留。</div>${table(['盘点任务号','盘点月份','盘点名称','盘点分类','物料数','盘点状态','创建时间','操作'],tasks.map(t=>[esc(t.id),esc(t.month),esc(t.name),esc(t.cat),t.rows.length,badge(t.status),esc(t.at),`<button class="btn sm" data-action="open-count" data-id="${t.id}">${t.status==='已完成'?'查看记录':'开始盘点'}</button>`]))}</div>`}
function view(){switch(ui.view){case 'base':return materialList();case 'material-change':return materialChangePage();case 'material-stats':return materialStats();case 'material-anomalies':return anomalyView('material');case 'overview':return warehouseOverview();case 'material-stock':case 'warehouse-stock':return warehouseList();case 'inbound':return documentList('inbound');case 'outbound':return documentList('outbound');case 'transfer':return documentList('transfer');case 'inventory-count':return monthly();case 'warehouse-movements':return movements();case 'warehouse-anomalies':return anomalyView('warehouse');default:return warehouseOverview()}}
function cssEsc(v){return String(v).replace(/[^a-zA-Z0-9_-]/g,c=>'\\'+c)}
function designSelector(el){const app=document.getElementById('app');if(!el||!app||!app.contains(el))return'';if(el.id)return '#'+el.id;let parts=[],cur=el;while(cur&&cur!==app){let part=cur.tagName.toLowerCase();let cls=[...cur.classList].filter(c=>!['active','design-selected','design-hover'].includes(c)).slice(0,2);if(cls.length)part+=cls.map(c=>'.'+cssEsc(c)).join('');let par=cur.parentElement;if(par){let same=[...par.children].filter(x=>x.tagName===cur.tagName);if(same.length>1)part+=`:nth-of-type(${same.indexOf(cur)+1})`}parts.unshift(part);cur=par}return '#app > '+parts.join(' > ')}
function canDesignSelect(el){if(!el||!document.getElementById('app')?.contains(el))return false;if(el.closest('#design-editor-root,#modal-root,#toast-root,.modal,.toast'))return false;if(el.closest('.data-table tbody'))return false;return true}
function pickDesignTarget(target){if(!target)return null;let el=target.closest('h1,h2,h3,h4,p,span,a,button,label,th,td,.nav-section,.statcard,.panel,.tree,.tablebox,.workspace,.sidebar,.pagehead,.topbar,main,aside,header,section,div');if(!canDesignSelect(el)){let parent=target.closest('.tablebox,.panel,.workspace,.sidebar');el=parent&&canDesignSelect(parent)?parent:null}return el}

function anomalyForm(kind,candidateKey=''){let c=anomalyCandidates(kind).find(x=>x.id===candidateKey);let body=`<div class="modal-body"><form id="anomaly-form" class="formgrid" data-kind="${kind}" data-source="${esc(candidateKey)}">${selectField('type','异常类型',kind==='material'?['物料编码重复','物料资料缺失','规格型号冲突','图纸资料异常','物料替代异常','物料状态异常','其他']:['实际数量与账面数量不符','到货数量与单据数量不符','出库数量与申请数量不符','物料错发','仓库错放','库存冻结异常','库存负数异常','库存记录异常','其他'],c?.type||'其他','',true)}<div class="formfield span2"><label>关联物料</label><select class="select" name="itemId"><option value="">不指定</option>${db.items.map(i=>`<option value="${i.id}" ${c?.item.id===i.id?'selected':''}>${esc(i.code||i.id)} · ${esc(i.name)}</option>`).join('')}</select></div>${field('title','异常标题',c?.title||'','text','full',true)}${selectField('level','严重程度',['低','中','高'],c?.level||'中')}${field('dept','责任部门',c?.dept||'仓库 / 技术 / 采购')}${field('owner','责任人',c?.owner||'待指派')}<div class="formfield span2"><label>异常说明 *</label><textarea class="textarea" name="desc" required rows="3">${esc(c?.detail||'')}</textarea></div></form><div id="form-error" class="err"></div></div>`;return makeModal(kind==='material'?'登记物料异常':'登记仓库异常',body,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-anomaly">登记异常</button>`)}
function anomalyHandle(id){let a=db.anomalies.find(x=>x.id===id);if(!a)return'';let i=db.items.find(x=>x.id===a.itemId);let body=`<div class="modal-body"><div class="grid2"><div><h3 style="margin-top:0">${esc(a.title)}</h3><p class="help">异常编号：${esc(a.id)}<br/>物料：${esc(i?.code||'无')}<br/>类型：${esc(a.type)}<br/>等级：${esc(a.level)}<br/>创建时间：${esc(a.at)}</p><div class="summary-box">${esc(a.desc)}</div></div><div><form id="handle-form">${selectField('state','处理状态',['待处理','处理中','已处理'],a.state)}<div class="formfield" style="margin-top:12px"><label>处理意见 / 结果 *</label><textarea class="textarea" rows="5" name="solution" placeholder="填写处理过程或核查结果">${esc(a.solution||'')}</textarea></div></form></div></div><h3 style="margin-top:20px">处理记录</h3>${(a.history||[]).length?`<div class="timeline">${a.history.map(h=>`<div class="timelog"><b>${esc(h.at)} · ${esc(h.state)}</b><p>${esc(h.note)}</p></div>`).join('')}</div>`:'<p class="thint">尚无处理记录。</p>'}</div>`;return makeModal('异常处理单',body,`<button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="save-handle" data-id="${a.id}">保存处理结果</button>`,true)}
function archiveModal(id){let i=db.items.find(x=>x.id===id);if(!i)return'';let hasStock=hand(i)>0||resv(i)>0||pending(i)>0||transit(i)>0;let body=`<div class="modal-body"><div class="notice ${hasStock?'warning':''}">“删除”采用软删除/归档，物料代码与历史版本及操作记录均保留。${hasStock?'该物料仍有实际、占用、待审核或在途库存，当前不能归档；请先处理库存，或直接修改使用状态为停用。':'此物料暂无库存，可登记原因后归档。'}</div><div class="formfield"><label>删除／归档原因 *</label><textarea class="textarea" id="archive-reason" rows="3" placeholder="例如：重复建档、测试档案作废"></textarea></div><div id="form-error" class="err"></div></div>`;return makeModal('删除／归档物料 · '+esc(i.code||i.id),body,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-archive" data-id="${i.id}" ${hasStock?'disabled':''}>确认归档并留痕</button>`)}

function countTaskModal(id){let t=db.counts.find(x=>x.id===id);if(!t)return'';let done=t.status==='已完成';let rows=t.rows.map((r,idx)=>{let i=db.items.find(x=>x.id===r.itemId);let v=r.counted??'';let keyName=`count_${r.itemId}_${r.version}_${encodeURIComponent(r.warehouse||'')}`;return `<tr><td>${idx+1}</td><td>${esc(i?.code||r.itemId)}</td><td class="name">${esc(i?.name||'—')}</td><td>V${r.version}</td><td>${esc(r.warehouse||'—')} / ${esc(r.location||'—')}</td><td class="num">${fmt(r.book)}</td><td>${esc(i?.unit||'')}</td><td><input class="input" type="number" min="0" step="1" name="${esc(keyName)}" style="width:100px" value="${esc(v)}" ${done?'disabled':''}></td><td>${v===''?'—':fmt(v-r.book)}</td></tr>`}).join('');let body=`<div class="modal-body"><p class="help">${esc(t.name)} · ${esc(t.cat)} · ${esc(t.month)} · ${badge(t.status)}</p><form id="count-values" data-id="${esc(id)}"><div class="scroll-table"><table class="data-table"><thead><tr><th>序号</th><th>物料编码</th><th>物料名称</th><th>版本</th><th>仓库 / 库位</th><th>账面库存</th><th>单位</th><th>实盘数量</th><th>差异</th></tr></thead><tbody>${rows}</tbody></table></div></form><div id="form-error" class="err"></div><div class="help" style="margin-top:12px">审核完成后不能再次修改；盘盈盘亏会生成对应库存流水。</div></div>`;return makeModal(`盘点任务 · ${esc(t.id)}`,body,`<button class="btn" data-action="close-modal">关闭</button>${done?'':`<button class="btn primary" data-action="commit-count" data-id="${esc(id)}">审核盘点并更新库存</button>`}`,true)}

function renderModal(){let m=ui.modal;if(!m){document.getElementById('modal-root').innerHTML='';return}let html='';switch(m.name){case 'add':html=matForm('new');break;case 'edit':html=matForm('edit',m.id);break;case 'replace':html=matForm('replace',m.id);break;case 'detail':html=detailsModal(m.id);break;case 'stock':html=stockForm(m.id,m.type);break;case 'add-anomaly':html=anomalyForm(m.kind,m.key);break;case 'handle-anomaly':html=anomalyHandle(m.id);break;case 'import':html=importModal();break;case 'new-count':html=newCountModal();break;case 'count-task':html=countTaskModal(m.id);break;case 'qr':html=qrModal(m.id);break;case 'archive':html=archiveModal(m.id);break;case 'change-form':html=changeForm(m.itemId);break;case 'view-change':html=viewChange(m.id);break;case 'business-form':html=businessForm(m.kind);break;case 'transfer-form':html=transferForm();break;case 'document-detail':html=documentDetail(m.id);break;}document.getElementById('modal-root').innerHTML=html}
const formobj=sel=>{let f=document.querySelector(sel);if(!f)return null;return Object.fromEntries(new FormData(f).entries())};
function setErr(message){let e=document.getElementById('form-error');if(e)e.textContent=message;else notify(message)}
function stockTxn(it,ver,type,qty,ref,note,warehouse=null,location=null){let wh=warehouse||it.warehouse||warehouseForItem(it),loc=location||it.location||'A-01';let b=ensureBucket(it,ver,wh,loc),before=Number(b.onHand||0),after=before,inQty=0,outQty=0,direction='辅助变动';switch(type){case '入库':case '在途到货':after=before+qty;b.onHand=after;inQty=qty;direction='入库';break;
case '质检合格入库':if(qty>b.pending)throw Error('质检合格数量不能超过待检库存。');b.pending-=qty;after=before+qty;b.onHand=after;inQty=qty;direction='入库';break;case '出库':if(qty>b.onHand-b.reserved-(b.frozen||0))throw Error('出库数量不能超过该仓库库位的可用库存。');after=before-qty;b.onHand=after;outQty=qty;direction='出库';break;case '占用':if(qty>b.onHand-b.reserved-(b.frozen||0))throw Error('占用数量不能超过可用库存。');b.reserved+=qty;break;case '解除占用':if(qty>b.reserved)throw Error('解除占用数量超过已占用库存。');b.reserved-=qty;break;case '待检入库':b.pending+=qty;break;case '质检不合格冻结':if(qty>b.pending)throw Error('不合格数量不能超过待检库存。');b.pending-=qty;b.frozen=(b.frozen||0)+qty;break;case '库存冻结':if(qty>b.onHand-b.reserved-(b.frozen||0))throw Error('冻结数量不能超过可用库存。');b.frozen=(b.frozen||0)+qty;break;case '库存解冻':if(qty>(b.frozen||0))throw Error('解冻数量超过冻结库存。');b.frozen-=qty;break;case '在途登记':b.transit+=qty;break;case '待审核登记':b.pending+=qty;break;case '待审确认入库':if(qty>b.pending)throw Error('确认数量超过待检库存。');b.pending-=qty;b.onHand+=qty;after=b.onHand;inQty=qty;direction='入库';break;default:throw Error('未知库存操作')}
let transaction={id:'STK'+key(),at:now(),itemId:it.id,code:it.code,version:ver,type,qty,before,after,inQty,outQty,direction,warehouse:wh,location:loc,ref,note,operator:'演示用户'};db.txns.unshift(transaction);it.updated=transaction.at;db.logs.unshift({type:'库存变动',at:transaction.at,itemId:it.id,detail:`${type} ${qty} ${it.unit}`});save();return transaction}
function saveMat(){let m=ui.modal,form=formobj('#material-form');if(!form)return;let mode=m.name==='replace'?'replace':m.name==='edit'?'edit':'new',id=m.id,i=db.items.find(x=>x.id===id),code=String(form.code||'').trim();let errors=[];if(!form.name?.trim())errors.push('入库名称必填');if(!form.unit?.trim())errors.push('基本单位必填');if(!TREES[form.cat]||!TREES[form.cat].includes(form.sub))errors.push('物料分类与小类不匹配');if(code&&db.items.some(x=>x.code===code&&x.id!==id))errors.push('物料编码重复');if(mode==='replace'&&code!==i.code)errors.push('替代不允许改变原物料编码');if(mode==='replace'&&!form.reason?.trim())errors.push('替代原因必填');for(let k of ['purchase','cost','sale','min','max','lead','safetyStock'])if(form[k]!==undefined&&(!Number.isFinite(Number(form[k]))||Number(form[k])<0))errors.push(k+' 不得为负数');if(Number(form.max)<Number(form.min))errors.push('最大库存不可小于最小库存');if(errors.length){setErr(errors.join('；'));return}
let attrs=['code','name','erpName','cat','sub','model','supplier','material','size','config','process','unit','drawing','status','property','brand','auxUnit','issueMethod','planStrategy','incomingInspection','defaultPurchaseUnit','purchaseLotRule','mrpStrategy','qualityStandard'];let nums=['purchase','cost','sale','lead','min','max','safetyStock','minPurchase','fixedLeadTime','variableLeadTime'];let patch={};attrs.forEach(x=>patch[x]=String(form[x]||'').trim());nums.forEach(x=>patch[x]=Number(form[x]||0));patch.stockEnabled=form.stockEnabled==='是';patch.batchManaged=form.batchManaged==='是';patch.serialManaged=form.serialManaged==='是';patch.inspectionRequired=form.inspectionRequired==='是';
if(mode==='new'){let idNew='MAT'+String(key()).padStart(6,'0');let obj={...patch,id:idNew,source:'演示新增',version:1,auditStatus:'未提交',createdAt:now(),warehouse:warehouseForCategory(patch.cat),location:'A-01',buckets:[{ver:1,onHand:0,reserved:0,pending:0,transit:0,frozen:0,cost:patch.cost,warehouse:warehouseForCategory(patch.cat),location:'A-01'}],hist:[],updated:now()};db.items.unshift(obj);db.logs.unshift({type:'新增物料',at:now(),itemId:obj.id,detail:obj.name});}
else if(mode==='edit'){let old=clone(i);Object.assign(i,patch,{updated:now()});db.logs.unshift({type:'编辑物料',at:now(),itemId:i.id,detail:`${old.name} → ${i.name}`});}
else{let old=clone(i),newver=i.version+1;Object.assign(i,patch,{version:newver,updated:now()});i.hist=i.hist||[];i.hist.push({fromVersion:old.version,toVersion:newver,at:now(),reason:form.reason,old:{name:old.name,erpName:old.erpName,model:old.model,supplier:old.supplier,cost:old.cost,material:old.material,size:old.size},new:{name:i.name,erpName:i.erpName,model:i.model,supplier:i.supplier,cost:i.cost,material:i.material,size:i.size}});i.buckets.push({ver:newver,onHand:0,reserved:0,pending:0,transit:0,frozen:0,cost:patch.cost,warehouse:i.warehouse,location:i.location});db.logs.unshift({type:'物料替代',at:now(),itemId:i.id,detail:`原编码 ${i.code}：V${old.version} → V${newver}，${form.reason}`});}
save();closeModal();render();notify(mode==='replace'?'物料替代成功：原编码保持不变，已生成历史版本。':mode==='new'?'已新增物料档案，等待提交审核。':'物料资料已更新。')}

function parseCsv(csv){let rows=[],row=[],buf='',q=false;csv=String(csv||'').replace(/^\uFEFF/,'');for(let i=0;i<csv.length;i++){let c=csv[i];if(c==='"'){if(q&&csv[i+1]==='"'){buf+='"';i++}else q=!q}else if(c===','&&!q){row.push(buf);buf=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&csv[i+1]==='\n')i++;row.push(buf);if(row.some(x=>x!==''))rows.push(row);row=[];buf=''}else buf+=c;}row.push(buf);if(row.some(x=>x!==''))rows.push(row);return rows}
